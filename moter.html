<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Møtene · TAFSE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side smal">
  <p class="overline">Møteplan og annaler</p>
  <h1 class="side-tittel">Møtene</h1>

  <section>
    <h2 class="seksjon-tittel">Kommende</h2>
    <ol class="mote-liste" id="kommende"></ol>
    <p style="margin-top:20px">
      <button class="knapp sekundar" id="ics" type="button">Legg møtene i kalenderen din</button>
    </p>
  </section>

  <section class="seksjon" id="avholdt-seksjon" hidden>
    <h2 class="seksjon-tittel">Avholdt</h2>
    <ol class="mote-liste" id="avholdt"></ol>
  </section>
</main>
<script src="assets/app.js"></script>
<script>
(async () => {
  const { moter } = await hentData();
  const neste = nesteMote(moter);

  let antall = {};
  try {
    if (await hvemErJeg()) (await api("bilder")).forEach((r) => (antall[r.mote] = r.antall));
  } catch (_) {}

  function rad(m) {
    const d = tilDato(m.dato);
    const forbi = status(m) === "forbi";
    const datoBoks = d
      ? `<span class="dag">${d.getDate()}</span><span class="mnd">${MANEDER_KORT[d.getMonth()]} ${d.getFullYear()}</span>`
      : `<span class="periode">${esc(m.periode || "Ikke fastsatt")}</span>`;
    let undertekst = "";
    if (m === neste && d) {
      const n = dagerTil(m);
      undertekst = n === 0 ? "I dag!" : n === 1 ? "I morgen" : `Om ${n} dager`;
    } else if (d) {
      undertekst = datoTekst(m);
    }
    const n = antall[m.id];
    return `<li class="mote ${m === neste ? "neste" : forbi ? "forbi" : ""}">
      <div class="mote-dato">${datoBoks}</div>
      <div>
        <h3>${esc(m.navn)}${m === neste ? `<span class="merkelapp">Neste</span>` : ""}</h3>
        <div class="dempet">Tafsemestere: ${esc(mesterTekst(m))}</div>
        ${undertekst ? `<div class="dempet" style="font-size:16px">${esc(undertekst)}</div>` : ""}
        ${n ? `<div style="font-size:16px; color:var(--gull)">${n} bilde${n === 1 ? "" : "r"}</div>` : ""}
      </div>
      <a class="knapp sekundar" href="mote.html?id=${encodeURIComponent(m.id)}">${forbi ? "Bilder og minner" : "Møteside"}</a>
    </li>`;
  }

  const kommende = moter.filter((m) => status(m) !== "forbi");
  const avholdt = moter.filter((m) => status(m) === "forbi").reverse();
  document.getElementById("kommende").innerHTML = kommende.map(rad).join("") || `<p class="tomt">Ingen kommende møter er lagt inn.</p>`;
  if (avholdt.length) {
    document.getElementById("avholdt-seksjon").hidden = false;
    document.getElementById("avholdt").innerHTML = avholdt.map(rad).join("");
  }

  document.getElementById("ics").addEventListener("click", () => {
    const pad = (x) => String(x).padStart(2, "0");
    const f = (x) => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`;
    const linjer = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TAFSE//Kalender//NO", "CALSCALE:GREGORIAN"];
    moter.filter((m) => m.dato).forEach((m) => {
      const d = tilDato(m.dato);
      linjer.push(
        "BEGIN:VEVENT",
        `UID:${m.id}@tafse.no`,
        `DTSTAMP:${f(new Date())}T000000Z`,
        `DTSTART;VALUE=DATE:${f(d)}`,
        `DTEND;VALUE=DATE:${f(new Date(d.getTime() + 86400000))}`,
        `SUMMARY:TAFSE: ${m.navn}`,
        `DESCRIPTION:Tafsemestere: ${mesterTekst(m)}. Dress er påbudt (§ 4).`,
        "END:VEVENT"
      );
    });
    linjer.push("END:VCALENDAR");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([linjer.join("\r\n")], { type: "text/calendar" }));
    a.download = "tafse-moter.ics";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
