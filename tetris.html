<body>
<main class="side">
  <p class="overline">Spill</p>
  <h1 class="side-tittel">Tetris</h1>
  <nav class="spillhall" aria-label="Spillene">
    <a href="tartaros.html">Tartaros</a>

  </nav>

  <div class="t-oppsett">
    <section class="t-spill" aria-label="Spillet">
      <div class="t-hode">
        <div class="t-tall"><span>Poeng</span><strong id="te-poeng">0</strong></div>
        <div class="t-tall"><span>Din rekord</span><strong id="te-rekord">0</strong></div>
        <button class="liten-knapp" type="button" id="te-ny">Nytt spill</button>
      </div>
      <div class="te-brett">
        <canvas id="te-lerret" tabindex="0" aria-label="Spillet. Piltaster flytter, pil opp snur, mellomrom slipper brikken, C holder."></canvas>
        <div class="t-melding" id="te-melding" hidden></div>
      </div>
      <div class="te-knapper" id="te-knapper" aria-label="Kontroller">
        <button type="button" data-g="hold">Hold</button>
        <button type="button" data-g="v" aria-label="Venstre">◀</button>
        <button type="button" data-g="snu" aria-label="Snu">⟳</button>
        <button type="button" data-g="h" aria-label="Høyre">▶</button>
        <button type="button" data-g="ned" aria-label="Ned">▼</button>
        <button type="button" data-g="slipp" aria-label="Slipp">⤓</button>
      </div>
      <div class="t-under"><p class="t-hjelp">Piltaster flytter, pil opp snur, mellomrom slipper og C holder. På mobil: dra for å flytte, trykk for å snu og sveip ned for å slippe.</p><button class="liten-knapp t-lyd" type="button" id="te-lyd">Lyd på</button></div>
    </section>
    <section class="t-side">
      <h2 class="t-tittel">Tavlen</h2>
      <div id="te-tavle"><p class="dempet">Laster …</p></div>
    </section>
  </div>
