<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tafsemøte · TAFSE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side">
  <p class="overline"><a href="moter.html" style="text-decoration:none">← Alle møter</a></p>
  <h1 class="side-tittel" id="tittel">Tafsemøte</h1>
  <p class="ingress" id="meta"></p>
  <div id="innhold"></div>
</main>
<script src="assets/app.js"></script>
<script>
const moteId = new URLSearchParams(location.search).get("id");
const boks = document.getElementById("innhold");

hentData().then(async ({ moter }) => {
  const mote = moter.find((m) => m.id === moteId);
  if (!mote) {
    document.getElementById("tittel").textContent = "Fant ikke møtet";
    boks.innerHTML = `<p><a href="moter.html">Se alle møter</a></p>`;
    return;
  }
  document.title = `${mote.navn} · TAFSE`;
  document.getElementById("tittel").textContent = mote.navn;
  document.getElementById("meta").textContent = `${datoTekst(mote)} · Tafsemestere: ${mesterTekst(mote)}`;
  const forbi = status(mote) === "forbi";

  kreverInnlogging(boks, async () => {
    boks.innerHTML = `
      <section>
        <h2 class="skjult">Bilder</h2>
        <form class="skjema" id="last-opp">
          <div class="to-kol">
            <div class="felt"><label for="filer">Last opp bilder fra møtet</label><input id="filer" type="file" accept="image/*" multiple required></div>
            <div class="felt"><label for="bildetekst">Bildetekst (valgfritt)</label><input id="bildetekst" maxlength="300"></div>
          </div>
          <div><button class="knapp" type="submit">Last opp</button></div>
          <div id="opp-melding" role="status"></div>
        </form>
        <div class="galleri" id="galleri"></div>
      </section>
      <section class="seksjon">
        <h2>${forbi ? "Hva gjorde vi?" : "Planer og spørsmål"}</h2>
        <div id="strom"></div>
      </section>`;

    let bilder = [];
    async function lastBilder() {
      const galleri = document.getElementById("galleri");
      try {
        bilder = await api(`bilder?mote=${encodeURIComponent(moteId)}`);
        galleri.innerHTML = bilder.length
          ? bilder.map((b, i) => `<figure>
              <button class="bilde" type="button" data-i="${i}" aria-label="Vis bildet større"><img src="/api/bilder/${b.id}" alt="${esc(b.tekst || "Bilde fra " + mote.navn)}" loading="lazy"></button>
              <figcaption><span>${esc(b.tekst || b.navn)}</span>${b.navn === MEG ? `<button class="liten-knapp" type="button" data-slett="${b.id}" aria-label="Slett bilde">Slett</button>` : `<span>${esc(b.navn)}</span>`}</figcaption>
            </figure>`).join("")
          : `<p class="tomt" style="grid-column:1/-1">Ingen bilder ennå.</p>`;
      } catch (err) {
        galleri.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      }
    }

    document.getElementById("last-opp").addEventListener("submit", async (e) => {
      e.preventDefault();
      const knapp = e.target.querySelector("button");
      const melding = document.getElementById("opp-melding");
      const filer = [...document.getElementById("filer").files];
      if (!filer.length) return;
      knapp.disabled = true;
      const feil = [];
      for (let i = 0; i < filer.length; i++) {
        melding.innerHTML = `<p class="melding">Laster opp ${i + 1} av ${filer.length} …</p>`;
        try {
          const fd = new FormData();
          fd.append("fil", await krympBilde(filer[i]), "bilde.jpg");
          fd.append("mote", moteId);
          fd.append("tekst", document.getElementById("bildetekst").value);
          await api("bilder", { method: "POST", body: fd });
        } catch (err) {
          feil.push(err.message);
        }
      }
      knapp.disabled = false;
      e.target.reset();
      melding.innerHTML = feil.length
        ? `<p class="melding feil">${feil.map(esc).join("<br>")}</p>`
        : `<p class="melding">Ferdig! ${filer.length} bilde${filer.length === 1 ? "" : "r"} lastet opp.</p>`;
      lastBilder();
    });

    document.getElementById("galleri").addEventListener("click", async (e) => {
      const slett = e.target.closest("[data-slett]");
      if (slett) {
        if (!confirm("Slette bildet for godt?")) return;
        try { await api(`bilder/${slett.dataset.slett}`, { method: "DELETE" }); lastBilder(); } catch (err) { alert(err.message); }
        return;
      }
      const vis = e.target.closest("[data-i]");
      if (vis) {
        const b = bilder[Number(vis.dataset.i)];
        visBilde(`/api/bilder/${b.id}`, `${b.tekst ? b.tekst + " · " : ""}Lastet opp av ${b.navn}`);
      }
    });

    lastBilder();
    byggStrom(document.getElementById("strom"), {
      mote: moteId,
      plassholder: forbi ? "Hvor spiste dere, hvem bestilte for mye, og ble § 4 nr. 5 brukt?" : "Forslag til program, spørsmål til Tafsemesterne, forfall?",
    });
  });
});
</script>
</body>
</html>
