<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitasjoner · TAFSE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side smal">
  <p class="overline">Kun for administrator</p>
  <h1 class="side-tittel">Invitasjoner</h1>
  <div id="innhold"></div>
</main>
<script src="assets/app.js"></script>
<script>
const boks = document.getElementById("innhold");

function melding(navn, lenke) {
  return `Hei ${navn}! Du er invitert inn på tafse.no, Taffelakademiets egen nettside. Åpne lenken, velg et profilbilde, skriv litt om deg selv og hva TAFSE betyr for deg, og lag et passord:\n\n${lenke}\n\nLenken er personlig, så ikke del den videre.`;
}

async function kopier(tekst, knapp) {
  try {
    await navigator.clipboard.writeText(tekst);
  } catch (_) {
    const t = document.createElement("textarea");
    t.value = tekst;
    document.body.append(t);
    t.select();
    document.execCommand("copy");
    t.remove();
  }
  const før = knapp.textContent;
  knapp.textContent = "Kopiert";
  setTimeout(() => (knapp.textContent = før), 1500);
}

kreverInnlogging(boks, async () => {
  let liste;
  try {
    liste = await api("invitasjoner");
  } catch (err) {
    boks.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
    return;
  }
  const base = `${location.origin}/velkommen.html`;
  const lenke = (i) => `${base}?navn=${encodeURIComponent(i.navn)}&kode=${i.kode}`;
  const mangler = liste.filter((i) => !i.registrert).length;

  boks.innerHTML = `
    <p>Send hver bror sin personlige lenke. Når han åpner den, må han velge profilbilde, skrive om seg selv og hva TAFSE betyr for ham, og lage et passord. ${mangler ? `${mangler} av ${liste.length} har ikke laget bruker ennå.` : "Alle har laget bruker."}</p>
    <div class="innlegg-liste">
      ${liste.map((i, n) => `
        <article class="innlegg">
          <div class="innlegg-topp">
            <h3>${esc(i.navn)}</h3>
            <span class="merkelapp ${i.registrert ? "status-vedtatt" : ""}">${i.registrert ? "Registrert" : "Ikke registrert"}</span>
          </div>
          ${i.registrert ? "" : `
          <p class="dempet" style="font-size:15px; word-break:break-all">${esc(lenke(i))}</p>
          <div class="handlinger">
            <button class="liten-knapp" data-melding="${n}">Kopier melding</button>
            <button class="liten-knapp" data-lenke="${n}">Kopier bare lenken</button>
            <a class="liten-knapp" style="text-decoration:none; display:inline-flex; align-items:center" href="sms:?&body=${encodeURIComponent(melding(i.navn, lenke(i)))}">Send som SMS</a>
          </div>`}
        </article>`).join("")}
    </div>`;

  boks.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.melding) { const i = liste[b.dataset.melding]; kopier(melding(i.navn, lenke(i)), b); }
    if (b.dataset.lenke) kopier(lenke(liste[b.dataset.lenke]), b);
  });
});
</script>
</body>
</html>
