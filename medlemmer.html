<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brødrene · TAFSE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side">
  <p class="overline">Medlemsregister</p>
  <h1 class="side-tittel">Brødrene</h1>
  <p class="ingress" id="ingress">Akademiets medlemmer og deres verv.</p>
  <div class="brodre" id="brodre"></div>
  <div id="skriv"></div>
</main>
<script src="assets/app.js"></script>
<script>
(async () => {
  const { medlemmer, moter } = await hentData();
  const verv = {};
  moter.forEach((m) => m.tafsemestere.forEach((n) => (verv[n] = m)));

  let profiler = {};
  const harBruker = new Set(await api("brukere").catch(() => []));
  const innlogget = !!(await hvemErJeg());

  async function tegn() {
    if (MEG) {
      profiler = {};
      try { (await api("profiler")).forEach((p) => (profiler[p.navn] = p.tekst)); } catch (_) {}
    }
    document.getElementById("brodre").innerHTML = medlemmer.map((n) => {
      const m = verv[n];
      const vervTekst = m
        ? `Tafsemester · ${esc(m.navn)}${status(m) === "forbi" ? " (avholdt)" : ""}`
        : "Tafsemester · trekkes ved neste runde";
      const tekst = !MEG
        ? `<p class="tom">Logg inn for å lese presentasjonen.</p>`
        : profiler[n]
          ? `<p>${esc(profiler[n])}</p>`
          : `<p class="tom">${esc(n)} har ennå ikke skrevet noe om seg selv${harBruker.has(n) ? "" : ", og har ikke laget bruker"}.</p>`;
      return `<article class="bror">
        <div class="medaljong" aria-hidden="true">${esc(n[0])}</div>
        <h3>${esc(n)}${n === MEG ? ' <span class="merkelapp">Deg</span>' : ""}</h3>
        <span class="verv">${vervTekst}</span>
        ${tekst}
      </article>`;
    }).join("");
  }

  await tegn();

  const skriv = document.getElementById("skriv");
  skriv.className = "seksjon";
  kreverInnlogging(skriv, async () => {
    await tegn();
    skriv.innerHTML = `<h2>Skriv om deg selv</h2>
      <form class="skjema" id="profil">
        <div class="felt"><label for="tekst">Presentasjonen din, ${esc(MEG)}</label><textarea id="tekst" maxlength="3000" placeholder="Yrke, livsmotto, livrett, fremste meritt innen etegilder. Bare det du selv vil dele."></textarea></div>
        <div><button class="knapp" type="submit">Lagre</button></div>
        <div id="melding" role="status"></div>
      </form>
      <h2 style="margin-top:40px">Bytt passord</h2>
      <form class="skjema" id="passord">
        <div class="to-kol">
          <div class="felt"><label for="gammelt">Nåværende passord</label><input id="gammelt" type="password" autocomplete="current-password" required></div>
          <div class="felt"><label for="nytt">Nytt passord</label><input id="nytt" type="password" minlength="6" autocomplete="new-password" required></div>
        </div>
        <div><button class="knapp sekundar" type="submit">Bytt passord</button></div>
        <div id="p-melding" role="status"></div>
      </form>`;
    const felt = document.getElementById("tekst");
    felt.value = profiler[MEG] || "";
    document.getElementById("profil").addEventListener("submit", async (e) => {
      e.preventDefault();
      const melding = document.getElementById("melding");
      try {
        await api(`profiler/${encodeURIComponent(MEG)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tekst: felt.value }),
        });
        melding.innerHTML = `<p class="melding">Lagret.</p>`;
        tegn();
      } catch (err) {
        melding.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      }
    });
    document.getElementById("passord").addEventListener("submit", async (e) => {
      e.preventDefault();
      const melding = document.getElementById("p-melding");
      try {
        await api("byttpassord", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gammelt: document.getElementById("gammelt").value, nytt: document.getElementById("nytt").value }),
        });
        e.target.reset();
        melding.innerHTML = `<p class="melding">Passordet er byttet.</p>`;
      } catch (err) {
        melding.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      }
    });
  });
})();
</script>
</body>
</html>
