<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brødrene · TAFSE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side">
  <p class="overline">Medlemsregister</p>
  <h1 class="side-tittel">Brødrene</h1>
  <div class="brodre" id="brodre"></div>
  <div id="skriv"></div>
</main>
<script src="assets/app.js"></script>
<script>
(async () => {
  const { medlemmer, moter } = await hentData();
  const verv = {};
  moter.forEach((m) => m.tafsemestere.forEach((n) => (verv[n] = m)));

  let profiler = {};
  const harBruker = new Set(await api("brukere").catch(() => []));
  await hvemErJeg();

  async function tegn() {
    if (MEG) {
      profiler = {};
      try { (await api("profiler")).forEach((p) => (profiler[p.navn] = p)); } catch (_) {}
    }
    document.getElementById("brodre").innerHTML = medlemmer.map((n) => {
      const m = verv[n];
      const p = profiler[n] || {};
      const vervTekst = m
        ? `Tafsemester · ${esc(m.navn)}${status(m) === "forbi" ? " (avholdt)" : ""}`
        : "Tafsemester · trekkes ved neste runde";
      let tekst;
      if (!MEG) tekst = `<p class="tom">Logg inn for å lese presentasjonen.</p>`;
      else if (!p.tekst && !p.tafse) tekst = `<p class="tom">${harBruker.has(n) ? `${esc(n)} har ikke skrevet noe ennå.` : `${esc(n)} har ikke laget bruker ennå.`}</p>`;
      else tekst = `<div class="bror-tekst" id="tekst-${esc(n)}">${p.tekst ? `<h4>Om meg</h4><p>${esc(p.tekst)}</p>` : ""}${p.tafse ? `<h4>Hva TAFSE betyr for meg</h4><p>${esc(p.tafse)}</p>` : ""}</div>
        <button class="se-mer" type="button" aria-expanded="false" aria-controls="tekst-${esc(n)}" hidden>Se mer</button>`;
      return `<article class="bror">
        ${avatar(n, MEG ? p.bilde_id : null)}
        <h3>${esc(n)}${n === MEG ? ' <span class="merkelapp">Deg</span>' : ""}</h3>
        <span class="verv">${vervTekst}</span>
        ${tekst}
      </article>`;
    }).join("");
    visSeMer();
  }

  // Viser «Se mer» bare på kort der teksten faktisk er avkortet
  function visSeMer() {
    document.querySelectorAll(".bror-tekst").forEach((t) => {
      const knapp = t.nextElementSibling;
      if (t.classList.contains("apen")) return;
      knapp.hidden = t.scrollHeight <= t.clientHeight + 2;
      t.classList.toggle("avkortet", !knapp.hidden);
    });
  }
  let venter;
  window.addEventListener("resize", () => { clearTimeout(venter); venter = setTimeout(visSeMer, 150); });
  document.fonts && document.fonts.ready.then(visSeMer);

  document.getElementById("brodre").addEventListener("click", (e) => {
    const knapp = e.target.closest(".se-mer");
    if (!knapp) return;
    const t = knapp.previousElementSibling;
    const apen = t.classList.toggle("apen");
    t.classList.toggle("avkortet", !apen);
    knapp.textContent = apen ? "Se mindre" : "Se mer";
    knapp.setAttribute("aria-expanded", apen);
    if (!apen) knapp.closest(".bror").scrollIntoView({ block: "nearest", behavior: "smooth" });
  });

  await tegn();

  const skriv = document.getElementById("skriv");
  skriv.className = "seksjon";
  kreverInnlogging(skriv, async () => {
    await tegn();
    const p = profiler[MEG] || {};
    skriv.innerHTML = `<h2>Din profil</h2>
      <form class="skjema" id="profil">
        <div class="felt">
          <label for="fil">Profilbilde</label>
          <div class="bilde-velger"><div id="forhånd">${avatar(MEG, p.bilde_id)}</div><input id="fil" type="file" accept="image/*" style="flex:1 1 220px"></div>
        </div>
        <div class="felt"><label for="tekst">Om deg selv</label><textarea id="tekst" maxlength="3000" placeholder="Hva driver du med, hvor kommer du ifra, hvem er du egentlig?"></textarea></div>
        <div class="felt"><label for="tafse">Hva betyr TAFSE for deg?</label><textarea id="tafse" maxlength="3000"></textarea></div>
        <div><button class="knapp" type="submit">Lagre</button></div>
        <div id="melding" role="status"></div>
      </form>
      <h2 style="margin-top:40px">Bytt passord</h2>
      <form class="skjema" id="passord">
        <div class="to-kol">
          <div class="felt"><label for="gammelt">Nåværende passord</label><input id="gammelt" type="password" autocomplete="current-password" required></div>
          <div class="felt"><label for="nytt">Nytt passord</label><input id="nytt" type="password" minlength="6" autocomplete="new-password" required></div>
        </div>
        <div><button class="knapp sekundar" type="submit">Bytt passord</button></div>
        <div id="p-melding" role="status"></div>
      </form>`;
    document.getElementById("tekst").value = p.tekst || "";
    document.getElementById("tafse").value = p.tafse || "";

    let nyttBilde = null;
    const filFelt = document.getElementById("fil");
    filFelt.addEventListener("change", async () => {
      nyttBilde = null;
      if (!filFelt.files[0]) return;
      try {
        nyttBilde = await krympProfilbilde(filFelt.files[0]);
        document.getElementById("forhånd").innerHTML = `<div class="medaljong med-bilde"><img src="${URL.createObjectURL(nyttBilde)}" alt="Forhåndsvisning"></div>`;
      } catch (err) {
        document.getElementById("melding").innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      }
    });

    document.getElementById("profil").addEventListener("submit", async (e) => {
      e.preventDefault();
      const melding = document.getElementById("melding");
      const knapp = e.target.querySelector("button[type=submit]");
      knapp.disabled = true;
      try {
        if (nyttBilde) {
          const fd = new FormData();
          fd.append("fil", nyttBilde, "profil.jpg");
          await api("profilbilde", { method: "POST", body: fd });
          nyttBilde = null;
          filFelt.value = "";
        }
        await api(`profiler/${encodeURIComponent(MEG)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tekst: document.getElementById("tekst").value, tafse: document.getElementById("tafse").value }),
        });
        melding.innerHTML = `<p class="melding">Lagret.</p>`;
        tegn();
      } catch (err) {
        melding.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      } finally {
        knapp.disabled = false;
      }
    });

    document.getElementById("passord").addEventListener("submit", async (e) => {
      e.preventDefault();
      const melding = document.getElementById("p-melding");
      try {
        await api("byttpassord", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gammelt: document.getElementById("gammelt").value, nytt: document.getElementById("nytt").value }),
        });
        e.target.reset();
        melding.innerHTML = `<p class="melding">Passordet er byttet.</p>`;
      } catch (err) {
        melding.innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
      }
    });
  });
})();
</script>
</body>
</html>
