<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAFSE · Taffelakademiet for Samvær og Etegilder</title>
<meta name="description" content="Taffelakademiet for Samvær og Etegilder. Fire møter i året.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <section class="hero" id="hero">
    <p class="overline">Anno MMXXVI</p>
    <h1>Taffelakademiet for<br>Samvær og Etegilder</h1>
  </section>

  <div class="side" style="padding-top:8px">
    <section class="kort" id="neste" aria-live="polite">
      <div>
        <p class="overline" style="margin:0">Neste møte</p>
        <p class="kort-tittel">Laster …</p>
      </div>
    </section>

    <div class="tre">
      <section>
        <h2>Kalender</h2>
        <div id="kommende"></div>
        <p style="margin-top:14px"><a href="kalender.html">Hele kalenderen</a></p>
      </section>
      <section>
        <h2>Vedtekter</h2>
        <div class="rad"><span>§ 1 Formål</span></div>
        <div class="rad"><span>§ 2 Tafsemøtet</span></div>
        <div class="rad"><span>§ 3 Møteplikt</span></div>
        <div class="rad"><span>§ 4 Bekledning</span></div>
        <p style="margin-top:14px"><a href="vedtekter.html">Les alle tolv paragrafer</a> · <a href="forslag.html">Foreslå en endring</a></p>
      </section>
      <section>
        <h2>Møtene</h2>
        <div id="forrige"></div>
        <p style="margin-top:14px"><a href="moter.html">Alle møter</a></p>
      </section>
    </div>
  </div>
</main>
<script src="assets/app.js"></script>
<script>
document.getElementById("hero").insertAdjacentHTML("afterbegin", `<a class="kylix-lenke" href="https://en.wikipedia.org/wiki/Kylix" target="_blank" rel="noopener" title="Hva er en kylix?" aria-label="Kylix på Wikipedia (åpnes i ny fane)">${LOGO_STOR}</a>`);

// Latter når man holder musa over kylixen
(() => {
  const lenke = document.querySelector(".kylix-lenke");
  if (!lenke || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const MASKE = `<svg viewBox="0 0 60 72" aria-hidden="true"><path d="M7 6 Q30 -1 53 6 Q57 32 48 52 Q40 70 30 70 Q20 70 12 52 Q3 32 7 6 Z" fill="#c9a24a"/><path d="M12 22 Q19 15 27 21" fill="none" stroke="#0b0b0a" stroke-width="2.5" stroke-linecap="round"/><path d="M33 21 Q41 15 48 22" fill="none" stroke="#0b0b0a" stroke-width="2.5" stroke-linecap="round"/><path d="M13 31 Q20 20 27 31 Q20 26 13 31 Z" fill="#0b0b0a"/><path d="M33 31 Q40 20 47 31 Q40 26 33 31 Z" fill="#0b0b0a"/><path d="M15 42 Q30 64 45 42 Q30 49 15 42 Z" fill="#0b0b0a"/></svg>`;
  const ORD = ["HA", "HA!", "HAHA", "HØ HØ", "HA HA"];
  let klar = true;

  function sprut() {
    const r = lenke.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("div");
      const ord = i % 3 === 2;
      el.className = "latter";
      if (ord) {
        el.textContent = ORD[Math.floor(Math.random() * ORD.length)];
        el.classList.add("latter-ord");
      } else {
        el.innerHTML = MASKE;
      }
      const str = ord ? 1 : 26 + Math.random() * 26;
      if (!ord) { el.style.width = str + "px"; el.style.height = str * 1.2 + "px"; }
      el.style.left = cx + "px";
      el.style.top = cy + "px";
      document.body.append(el);
      const vinkel = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.5;
      const avstand = 140 + Math.random() * 180;
      const dx = Math.cos(vinkel) * avstand, dy = Math.sin(vinkel) * avstand * 0.75 - 40;
      const rot = (Math.random() - 0.5) * 120;
      const tid = 1300 + Math.random() * 700;
      el.animate([
        { transform: "translate(-50%, -50%) scale(.2) rotate(0deg)", opacity: 0 },
        { opacity: 1, offset: 0.15 },
        { transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7}px)) scale(1.1) rotate(${rot * 0.7}deg)`, opacity: 1, offset: 0.6 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 50}px)) scale(.9) rotate(${rot}deg)`, opacity: 0 },
      ], { duration: tid, easing: "cubic-bezier(.2,.7,.3,1)", delay: Math.random() * 180 }).finished.then(() => el.remove());
    }
  }

  lenke.addEventListener("mouseenter", () => {
    if (!klar) return;
    klar = false;
    lenke.classList.remove("snurr");
    void lenke.offsetWidth;
    lenke.classList.add("snurr");
    sprut();
    setTimeout(() => (klar = true), 1400);
  });
  lenke.addEventListener("animationend", () => lenke.classList.remove("snurr"));
})();

hentData().then(({ moter }) => {
  const neste = nesteMote(moter);
  const kort = document.getElementById("neste");
  if (neste) {
    const n = dagerTil(neste);
    const nedtelling = n === null ? "" : n === 0 ? " · I dag!" : n === 1 ? " · I morgen" : ` · Om ${n} dager`;
    kort.innerHTML = `<div>
        <p class="overline" style="margin:0">Neste møte</p>
        <p class="kort-tittel">${esc(neste.navn)}</p>
        <p class="kort-meta" style="margin:0">${esc(datoTekst(neste))}${nedtelling}<br>Tafsemestere: ${esc(mesterTekst(neste))}</p>
      </div>
      <a class="knapp" href="mote.html?id=${encodeURIComponent(neste.id)}">Til møtesiden</a>`;
  } else {
    kort.innerHTML = `<div><p class="overline" style="margin:0">Neste møte</p><p class="kort-tittel">Ikke fastsatt ennå</p></div>`;
  }

  const kommende = moter.filter((m) => status(m) === "kommende").slice(0, 4);
  document.getElementById("kommende").innerHTML = kommende.map((m) =>
    `<div class="rad"><span>${esc(m.navn)}</span><span class="dempet">${esc(m.dato ? `${tilDato(m.dato).getDate()}. ${MANEDER_KORT[tilDato(m.dato).getMonth()]}` : m.periode)}</span></div>`
  ).join("") || `<p class="dempet">Ingen kommende møter lagt inn.</p>`;

  const forbi = moter.filter((m) => status(m) === "forbi");
  const sist = forbi[forbi.length - 1];
  document.getElementById("forrige").innerHTML = sist
    ? `<a class="knapp sekundar" href="mote.html?id=${encodeURIComponent(sist.id)}">${esc(sist.navn)}</a>`
    : "";
});
</script>
</body>
</html>
