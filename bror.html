<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tafsebror · TAFSE</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="side">
  <p class="overline"><a href="medlemmer.html" style="text-decoration:none">← Alle brødrene</a></p>
  <div id="profil"><p class="dempet">Laster …</p></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/land-modell.js"></script>
<script src="assets/land-kart.js"></script>
<script src="assets/land-editor.js"></script>
<script>
const FAKTA = [
  ["yrke", "Yrke"],
  ["bosted", "Bosted"],
  ["livrett", "Livrett"],
  ["drikke", "Foretrukne drikk"],
  ["restaurant", "Favorittrestaurant"],
  ["talent", "Skjult talent"],
  ["motto", "Livsmotto"],
];

(async () => {
  const boks = document.getElementById("profil");
  const { medlemmer, moter } = await hentData();
  const navn = new URLSearchParams(location.search).get("navn");
  if (!medlemmer.includes(navn)) {
    boks.innerHTML = `<h1 class="side-tittel">Fant ikke broren</h1><p><a href="medlemmer.html">Se alle brødrene</a></p>`;
    return;
  }
  document.title = `${navn} · TAFSE`;
  const verv = moter.find((m) => m.tafsemestere.includes(navn));

  kreverInnlogging(boks, async () => {
    const egen = navn === MEG;
    const [profiler, aktivitet, poster, brukere] = await Promise.all([
      api("profiler").catch(() => []),
      api("aktivitet").catch(() => null),
      api(`poster?navn=${encodeURIComponent(navn)}`).catch(() => []),
      api("brukere").catch(() => []),
    ]);
    let p = profiler.find((x) => x.navn === navn) || {};
    let info = p.info || {};
    let land = p.land || null;

    function faktaHtml() {
      const fylt = FAKTA.filter(([k]) => info[k]);
      if (!fylt.length) return `<p class="tom-tekst">${egen ? "Du har ikke fylt inn noe ennå." : `${esc(navn)} har ikke fylt inn noe ennå.`}</p>`;
      return `<dl class="fakta">${fylt.map(([k, t]) => `<div><dt>${t}</dt><dd>${esc(info[k])}</dd></div>`).join("")}</dl>`;
    }

    function landHtml() {
      if (land) return landKortHtml(land);
      return `<p class="tom-tekst">${egen
        ? "Du har ikke grunnlagt drømmelandet ditt ennå. Velg geografi, geologi, folk, styresett, valgordning og økonomi, så tegnes landet med kart, flagg og en faglig vurdering."
        : `${esc(navn)} har ikke grunnlagt drømmelandet sitt ennå.`}</p>`;
    }

    const postHtml = (x) => `<article class="mini-post">
      <div class="dempet post-tid">${esc(tidTekst(x.opprettet))}${x.skal.length ? ` · ${x.skal.length} skål` : ""}</div>
      ${x.tekst ? `<p class="post-tekst">${esc(x.tekst)}</p>` : ""}
      ${x.bilde_id ? `<img src="/api/bilder/${x.bilde_id}" alt="" loading="lazy">` : ""}
    </article>`;

    function tegn() {
      boks.innerHTML = `
        <header class="profil-topp">
          ${avatar(navn, p.bilde_id)}
          <div class="profil-hode">
            <p class="overline" style="margin:0">Tafsebror</p>
            <h1 class="side-tittel" style="margin:0">${esc(navn)}${egen ? ' <span class="merkelapp">Deg</span>' : ""}</h1>
            <p class="verv" style="margin:0">${verv ? `Tafsemester · ${esc(verv.navn)}${status(verv) === "forbi" ? " (avholdt)" : ""}` : "Tafsemester · trekkes ved neste runde"}</p>
            ${aktivitet ? skarHtml(aktivitet.brodre[navn], aktivitet.vekt) : ""}
            ${egen ? `<a class="knapp sekundar" href="medlemmer.html#skriv" style="align-self:flex-start">Endre bilde og presentasjon</a>` : ""}
          </div>
        </header>

        ${p.tekst || p.tafse ? `<section class="seksjon profil-tekst">
          ${p.tekst ? `<h2>Om meg</h2><p>${esc(p.tekst)}</p>` : ""}
          ${p.tafse ? `<h2>Hva TAFSE betyr for meg</h2><p>${esc(p.tafse)}</p>` : ""}
        </section>` : `<p class="tom-tekst seksjon">${brukere.includes(navn) ? `${esc(navn)} har ikke skrevet noen presentasjon ennå.` : `${esc(navn)} har ikke laget bruker ennå.`}</p>`}

        <section class="seksjon">
          <div class="seksjon-hode"><h2>Fakta</h2>${egen ? `<button class="liten-knapp" type="button" id="rediger-fakta">Rediger</button>` : ""}</div>
          <div id="fakta">${faktaHtml()}</div>
        </section>

        <section class="seksjon">
          <div class="seksjon-hode"><h2>Drømmelandet</h2>${egen ? `<button class="liten-knapp" type="button" id="rediger-land">${land ? "Endre grunnloven" : "Grunnlegg et land"}</button>` : ""}</div>
          <div id="land">${landHtml()}</div>
        </section>

        <section class="seksjon">
          <div class="seksjon-hode"><h2>Siste i Salongen</h2><a class="liten-knapp" href="salongen.html" style="text-decoration:none; display:inline-flex; align-items:center">Til Salongen</a></div>
          ${poster.length ? `<div class="mini-poster">${poster.slice(0, 6).map(postHtml).join("")}</div>` : `<p class="tom-tekst">Ingen poster ennå.</p>`}
        </section>`;

      if (land) tegnLandKartI(document.getElementById("land"), land);
      if (!egen) return;

      document.getElementById("rediger-fakta").addEventListener("click", () => {
        const f = document.getElementById("fakta");
        f.innerHTML = `<form class="skjema" id="fakta-skjema">
          <div class="to-kol">${FAKTA.map(([k, t]) => `<div class="felt"><label for="f-${k}">${t}</label><input id="f-${k}" maxlength="140" value="${esc(info[k] || "")}"></div>`).join("")}</div>
          <div style="display:flex; gap:12px; flex-wrap:wrap"><button class="knapp" type="submit">Lagre</button><button class="knapp sekundar" type="button" id="avbryt-fakta">Avbryt</button></div>
          <div id="fakta-melding" role="status"></div>
        </form>`;
        document.getElementById("avbryt-fakta").addEventListener("click", () => (f.innerHTML = faktaHtml()));
        document.getElementById("fakta-skjema").addEventListener("submit", async (e) => {
          e.preventDefault();
          const ny = {};
          FAKTA.forEach(([k]) => { const v = document.getElementById(`f-${k}`).value.trim(); if (v) ny[k] = v; });
          try {
            await api(`profiler/${encodeURIComponent(MEG)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ info: ny }) });
            info = ny;
            f.innerHTML = faktaHtml();
          } catch (err) {
            document.getElementById("fakta-melding").innerHTML = `<p class="melding feil">${esc(err.message)}</p>`;
          }
        });
      });

      document.getElementById("rediger-land").addEventListener("click", (e) => {
        e.currentTarget.hidden = true;
        const lb = document.getElementById("land");
        byggLandEditor(lb, land, async (ny) => {
          await api(`profiler/${encodeURIComponent(MEG)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ land: ny }) });
          land = ny;
          setTimeout(() => { tegn(); document.getElementById("land").scrollIntoView({ block: "start" }); }, 900);
        });
        lb.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }

    tegn();
  });
})();
</script>
</body>
</html>
